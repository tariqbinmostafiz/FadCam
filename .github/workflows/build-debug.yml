name: Build FadCam Debug APK

# চালু হয় যখন:
#  1) phase1-root-reliability ব্র্যাঞ্চে push করা হয়
#  2) Actions ট্যাব থেকে হাতে "Run workflow" চাপা হয়
# কোনো secret/keystore লাগে না। APK debug key দিয়ে নিজে সাইন হয়, সরাসরি ইনস্টল করা যায়।
on:
  push:
    branches: [ phase1-root-reliability ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # settings.gradle.kts এই patched Media3 ফোল্ডার /tmp/media3-patched থেকে নেয়।
      # এটা না থাকলে muxer প্যাচ ছাড়া বিল্ড হবে বা ফেইল করবে।
      - name: Clone patched Media3 (required)
        run: |
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          echo "Patched Media3 cloned"

      # gradle-daemon-jvm.properties নিজেই JDK 21 daemon নামিয়ে নেয়; পুরনো কাজ-করা workflow-এর মতোই 17 রাখা হলো
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # নোট: টাস্কের নামে "pro" শব্দ থাকলে build.gradle.kts ভিন্ন ABI সেটিং নেয়,
      # তাই assembleDefaultDebug (এতে "pro" নেই) ব্যবহার করা হয়েছে।
      # --no-watch-fs          : "Already watching path" file-watcher সমস্যা এড়ায়
      # --no-configuration-cache: composite build (media3-patched) এর সাথে cache সমস্যা এড়ায়
      # pipefail               : tee ব্যবহার করলেও gradle ফেইল করলে step ফেইল হবে
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDefaultDebug --stacktrace \
            --no-watch-fs --no-configuration-cache 2>&1 | tee build.log

      - name: Show real error (on failure)
        if: failure()
        shell: bash
        run: |
          {
            echo '### Gradle error summary'
            echo '```'
            grep -n -A6 -E "What went wrong|Caused by:|Could not (resolve|find|determine)|error:" build.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # কোন ডিপেন্ডেন্সি resolve হচ্ছে না সেটা সরাসরি দেখায় (FAILED / Could not ... লাইন)
      - name: Diagnose dependencies (on failure)
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:dependencies --configuration defaultDebugRuntimeClasspath \
            --no-watch-fs --no-configuration-cache > deps.log 2>&1 || true
          {
            echo '### Dependency problems'
            echo '```'
            grep -n -B2 -A4 -E "FAILED|Could not|UNRESOLVED|No matching|What went wrong" deps.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List built APKs
        run: ls -lh app/build/outputs/apk/default/debug/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

      # বিল্ড ফেইল করলে লগ ডাউনলোড করে আমাকে পাঠানো যাবে
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            deps.log
            app/build/reports/**
